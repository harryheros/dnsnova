# dnsnova configuration
#
# Changes are applied automatically when this file is saved (or on
# `systemctl reload dnsnova`). Check a file with: dnsnova -t -c <file>
# Durations accept "500ms", "3s", "24h", or a plain number of seconds.

[server]
# "public":  anyone may query; abuse is handled by the [limits] below.
# "private": only the networks in [access] allow may query.
mode = "public"

# Addresses for plain DNS (UDP and TCP). On hosts with several IP addresses,
# list each one rather than ":53", so UDP replies leave from the address the
# query was sent to.
listen = ["203.0.113.10:53", "[2001:db8::10]:53"]

# Certificates, the ACME account and other state.
data_dir = "/var/lib/dnsnova"

# DNS Cookies (RFC 7873, with the server cookie of RFC 9018 that BIND, Knot
# and Unbound share): a client that sends its cookie back has shown its
# address is not forged, so response rate limiting leaves it alone. The
# secret is in data_dir/secrets/cookie-secret; copy that file to every node
# behind one anycast address so they accept each other's cookies.
cookies = true

# Load balancers in front of this server (HAProxy, dnsdist, a cloud network
# load balancer) that send the PROXY protocol header, so the server sees each
# client's address instead of the balancer's: version 1 or 2 on TCP, DoT and
# DoH over HTTPS, version 2 on UDP (as dnsdist sends it). From these
# addresses the header is required; from anyone else it is never read.
# DoQ and HTTP/3 have no PROXY protocol.
proxy_protocol = []     # e.g. ["10.0.0.5/32"]

[dot]
# DNS over TLS (TCP). Needs a certificate (see [tls]).
listen = ["203.0.113.10:853", "[2001:db8::10]:853"]

[doq]
# DNS over QUIC (RFC 9250, UDP). Needs a certificate. Usually the same
# addresses as [dot]: DoT uses TCP 853 and DoQ UDP 853.
listen = ["203.0.113.10:853", "[2001:db8::10]:853"]

[doh]
# DNS over HTTPS, built in: HTTP/1.1 and HTTP/2 over TCP. Needs a certificate.
https_listen = ["203.0.113.10:443", "[2001:db8::10]:443"]
# Also serve HTTP/3 on the same addresses and ports over UDP (443/UDP for the
# addresses above). HTTP/1.1 and HTTP/2 responses then tell clients about it
# with an Alt-Svc header.
http3 = true
# Or behind a reverse proxy such as nginx, which then handles TLS, HTTP/2 and
# HTTP/3: plain HTTP on a local address. Leave empty to disable.
listen = ""
path = "/dns-query"
# The client address is taken from X-Real-IP only when the request comes
# from one of these proxies.
trusted_proxies = ["127.0.0.1/32", "::1/128"]

[tls]
# Where the certificate for DoT, DoQ and DoH comes from:
#   "acme"  obtain and renew one automatically from Let's Encrypt
#   "files" use files another program manages (e.g. nginx or certbot);
#           they are reloaded when they change
#   "off"   no encrypted DNS
certificate = "acme"
domains = ["dns.example.com"]   # must point to this server
# Also certify the public addresses in server.listen. Clients such as
# Windows 11, iOS and macOS then upgrade from port 53 to encrypted DNS by
# themselves (DDR). Such certificates last about 6 days and are renewed
# automatically.
ip_addresses = true
email = ""                      # optional contact for Let's Encrypt
# How Let's Encrypt checks that you control the names. Chosen automatically:
# "tls-alpn-01" when DoH or DoT listens on port 443, otherwise "http-01",
# which needs port 80 (http_challenge_listen) during issuance.
# challenge = "tls-alpn-01"
# http_challenge_listen = ":80"
# acme_directory = "https://acme-v02.api.letsencrypt.org/directory"
# For "files":
# cert_file = "/etc/letsencrypt/live/dns.example.com/fullchain.pem"
# key_file = "/etc/letsencrypt/live/dns.example.com/privkey.pem"

[ddr]
# Answer _dns.resolver.arpa so clients can discover the encrypted endpoints
# (RFC 9462): DoT, DoH (with h3 when http3 is on) and DoQ. Uses the first
# name in tls.domains.
enabled = true

[upstream]
# Where queries are forwarded. Formats:
#   1.1.1.1                          plain DNS (UDP, TCP when truncated)
#   tcp://1.1.1.1                    plain DNS over TCP
#   tls://one.one.one.one            DNS over TLS
#   https://cloudflare-dns.com/dns-query    DNS over HTTPS
#   quic://dns.example                DNS over QUIC (port 853)
# A host name can be pinned to an address to skip the bootstrap lookup:
#   https://dns.google/dns-query#8.8.8.8
primary = ["https://1.1.1.1/dns-query", "https://1.0.0.1/dns-query"]

# Used only when every primary upstream fails or has not answered within
# fallback_delay.
fallback = ["https://dns.google/dns-query#8.8.8.8"]

# Resolve upstream host names through these IP addresses (plain or encrypted).
bootstrap = ["1.1.1.1:53", "8.8.8.8:53"]

# Query the fastest N primaries at once and take the first good answer.
# 0 = all of them.
parallel = 2
timeout = "3s"
fallback_delay = "1.5s"

[recursion]
# Resolve names itself, from the root servers down, instead of forwarding
# to the upstreams above: no third party sees the queries. Answers are
# checked with DNSSEC (the root keys KSK-2017 and KSK-2024 are built in).
enabled = false
dnssec = true
# Each server is sent only the part of the name it needs (RFC 9156): the
# root sees "com", not "www.example.com".
qname_minimisation = true
# Also reach name servers over IPv6 (skipped automatically while it fails).
ipv6 = true
# When no name server of a domain can be reached, ask the upstreams above.
# Never after a failed DNSSEC check.
fallback = true
# A public server never sends queries into private networks; list networks
# with your own name servers here, e.g. ["10.0.0.0/8"]. This also opens
# 127.0.0.0/8 and link-local addresses when listed, nothing else.
# allow_networks = []
# Negative trust anchors (RFC 7646): domains whose answers are passed on
# without the DNSSEC check, for a domain whose owner broke its DNSSEC (the
# DNSSEC page of the web interface lists names that fail, and adds them
# here). Remove each once it validates again: meanwhile a forged answer for
# it would get through too.
# negative_trust_anchors = ["broken.example"]
# DNS Cookies with name servers (RFC 7873): each question carries a cookie
# made for that server; an answer with the wrong one, or without one from a
# server that always sends it, is forged, and the question goes again over
# TCP. Servers that cannot take the option are asked without it.
cookies = true

[cache]
size = 100000           # entries, about 1 to 2 KB each; 0 disables the answer
                        # cache (recursion keeps its own working cache)
min_ttl = 0             # raise short TTLs to at least this
max_ttl = "24h"
max_negative_ttl = "1h" # NXDOMAIN and "no records"
serve_stale = "24h"     # answer from an expired entry while refreshing it
prefetch = true         # refresh popular entries before they expire
persist = "auto"        # keep answers across restarts in data_dir/cache.bin (saved
                        # every 10 minutes and on shutdown): "on", "off", or "auto"
                        # = on in public mode, off in private mode. The file shows
                        # which names were looked up (never by whom), which with a
                        # few users, as at home, is close to their browsing; it is
                        # deleted whenever this is off

[access]
# Private mode only.
allow = ["198.51.100.0/24", "2001:db8:1000::/48"]
# Never answered, in either mode (wins over allow).
deny = []

[local]
# Names DNSNova answers itself, without asking upstream: "name address".
# "*.name" covers every name below it. A name listed here answers only the
# addresses given (A and AAAA); 0.0.0.0 makes it unreachable.
records = [
  # "nas.home 192.168.1.5",
  # "*.lab.home 192.168.1.9",
]

[ecs]
# Answer as if from another network (EDNS Client Subnet): this public
# address or network is sent with every query, and name servers that
# support it answer as they would for it. An address stands for its /24
# (IPv4) or /56 (IPv6). Your clients' addresses are never sent. With
# upstreams, they must support it too. Changing it clears the cache.
# Empty: off.
address = ""
# For measurement tools (DomainNova, for one): a secret DNS over HTTPS path
# on which each query's own client subnet is sent to the domains' name
# servers, so the tool sees how names resolve for that network. Those
# answers come straight from resolving, never from or into the cache, and
# reach no other client. Needs recursion. Keep the path secret; anyone with
# it can make this server ask name servers on any network's behalf.
# client_path = "/ecs-<24 or more random letters and digits>"

[stats]
# How far back the overview goes: "24h", "7d" or "30d". In memory only.
retention = "7d"

[limits]
# Mobile carriers put many people behind one IPv4 address, so these are
# per address, not per person; abuse of UDP is limited further by rrl_rate.
client_qps = 100            # per IPv4 address or IPv6 /56
client_burst = 400
prefix_qps = 1000           # per IPv4 /24 or IPv6 /48
prefix_burst = 4000
global_qps = 50000          # whole server; 0 = no limit
upstream_concurrency = 2000 # upstream queries in flight
zone_concurrency = 50       # upstream queries in flight per domain
# Phones keep a DoT or DoQ connection open while in use, so each one is
# roughly one device online. An idle connection takes about 25 KB (TCP, DoT)
# or 70 KB (DoQ): the defaults need at most about 250 and 210 MB.
tcp_connections = 10000     # TCP, DoT and DoH
quic_connections = 3000     # DoQ and HTTP/3; above half of it, new clients
                            # must first prove their address (QUIC Retry)
client_connections = 100    # open connections per address (IPv4, or IPv6 /56),
                            # all protocols together; 0 = no limit
tcp_pipeline = 16           # concurrent queries per TCP, DoT, DoQ or HTTP/3 connection
tcp_idle_timeout = "10s"    # also the idle timeout of QUIC connections
udp_max_size = 1232
rrl_rate = 20               # identical UDP responses per second per network
rrl_slip = 2                # send every 2nd limited response truncated
block_any = true            # answer ANY queries with NOTIMP

[metrics]
# Prometheus metrics at /metrics and a health check at /healthz.
listen = "127.0.0.1:9153"

[admin]
# The web interface and its API (docs/api.md). Leave it on 127.0.0.1 and
# reach it through an SSH tunnel (ssh -L 7000:127.0.0.1:7000 you@server),
# or listen on ":7000" to reach it from other machines too, protected by a
# password, login lockout and optional two-step verification. Other machines
# get it over HTTPS on the same port once a certificate exists. Plain HTTP
# is answered on this server (or for a reverse proxy here that sends
# X-Forwarded-Proto: https) and, in private mode, to the private networks in
# access.allow: a home or office network opens it directly. Leave empty to
# turn it off.
listen = "127.0.0.1:7000"

[status]
# A public page at the DoH address (https://your-domain/): the addresses,
# setup steps for Android, iPhone and Mac (a profile to download), Windows,
# browsers and routers, what the server keeps, and a check that shows a
# visitor whether their device is using this server. No statistics. In
# private mode only allowed networks can open it.
enabled = false

[filter]
# A second, filtered service on the same server: ads, trackers and malware
# are answered with "blocked" (NXDOMAIN, Extended DNS Error 15). The usual
# addresses stay unfiltered; clients choose by the address they use:
#   plain DNS  the addresses in listen below
#   DoT, DoQ   the names in names (add them to DNS and to the certificate;
#              with certificate = "acme" they are added for you)
#   DoH        the path doh_path, or a name in names
# Set all = true to filter every address instead.
enabled = false
# lists = ["https://raw.githubusercontent.com/harryheros/shieldnova/main/dist/shieldnova-full.txt"]
# block = ["example-ads.com"]       # your own rules: the name and everything under it
# allow = ["needed.example.com"]    # always answered, whatever the lists say
# update_interval = "24h"
# doh_path = "/filtered"
# names = ["filtered.dns.example.com"]
# listen = ["203.0.113.10:5353"]

# There is no setting to log queries. DNSNova writes no queries or client
# addresses to disk; for troubleshooting, start the query log in the admin
# interface: it is kept in memory, hides the last part of client addresses
# unless asked not to, and stops by itself.

[cluster]
# Several servers sharing one configuration: see docs/cluster.md. Without a
# role this server stands alone. Changed only in this file (not in the web
# interface); takes effect after a restart.
# role = "primary"            # or "follower"
# name = "ams-1"              # default: the host name
# region = "Amsterdam"
# listen = "10.0.0.1:7001"    # primary: where followers reach it
# primary = "10.0.0.1:7001"   # follower: the primary
# interval = "10s"            # follower: how often it syncs

[anycast]
# Announce or withdraw this server's anycast route as its health changes,
# with your own commands (no shell; see docs/cluster.md). Only in this file.
enabled = false
# announce = ["birdc", "enable", "anycast"]
# withdraw = ["birdc", "disable", "anycast"]
# interval = "2s"
# rise = 3                    # good checks in a row before announcing
# fall = 3                    # failed checks in a row before withdrawing
# drain = "5s"                # at shutdown: withdraw, then keep answering this long

[alerts]
# Notifications when something is wrong, and when it is fixed, to Telegram,
# Discord, Slack or a JSON webhook (see docs/alerts.md). Where they go is set
# in the web interface (Settings > Alerts) and kept in
# data_dir/secrets/alerts.json, not here. A threshold of 0 turns its check off.
enabled = false
# repeat = "4h"                  # remind while a problem lasts (0s: once)
# nodes = true                   # cluster primary: also notify about the followers
# upstream_down_for = "30s"      # every upstream failing (critical)
# upstream_failing_for = "5m"    # one upstream failing half its queries
# servfail_ratio = 0.05          # SERVFAIL share over five minutes, DNSSEC aside
# servfail_min_queries = 500
# servfail_for = "5m"
# latency_p95 = "500ms"          # queries not in the cache, over five minutes
# latency_min_queries = 100
# latency_for = "5m"
# dnssec_failures = 100          # answers refused for DNSSEC in five minutes
# cert_warn_days = 14
# cert_critical_days = 3
