# dnsnova configuration
#
# Changes apply when this file is saved (or on `systemctl reload dnsnova`).
# Check a file with: dnsnova -t -c <file>
# Durations: "500ms", "3s", "24h", or a number of seconds.

[server]
# "public":  anyone may query, within [limits].
# "private": only the networks in access.allow may query.
mode = "public"

# Plain DNS (UDP and TCP). On hosts with several addresses, list each one
# rather than ":53", so UDP replies leave from the address queried.
listen = ["203.0.113.10:53", "[2001:db8::10]:53"]

# Certificates, the ACME account and other state.
data_dir = "/var/lib/dnsnova"

# DNS Cookies (RFC 7873, server cookies as in RFC 9018): clients that return
# a valid cookie are exempt from response rate limiting. Behind one anycast
# address, copy data_dir/secrets/cookie-secret to every node.
cookies = true

# Load balancers that send the PROXY protocol header (HAProxy, dnsdist, cloud
# load balancers), so clients' real addresses are seen: v1 or v2 on TCP, DoT
# and DoH over HTTPS, v2 on UDP. Required from these addresses, ignored from
# all others. Not available for DoQ and HTTP/3.
proxy_protocol = []     # e.g. ["10.0.0.5/32"]

[dot]
# DNS over TLS (TCP). Needs a certificate (see [tls]).
listen = ["203.0.113.10:853", "[2001:db8::10]:853"]

[doq]
# DNS over QUIC (RFC 9250). Needs a certificate. Usually the same addresses
# as [dot]: DoT uses TCP 853, DoQ UDP 853.
listen = ["203.0.113.10:853", "[2001:db8::10]:853"]

[doh]
# DNS over HTTPS: HTTP/1.1 and HTTP/2. Needs a certificate.
https_listen = ["203.0.113.10:443", "[2001:db8::10]:443"]
# Also HTTP/3 on the same addresses over UDP, advertised with Alt-Svc.
http3 = true
# Or plain HTTP on a local address, behind a reverse proxy such as nginx that
# handles TLS. Empty: off.
listen = ""
path = "/dns-query"
# X-Real-IP is trusted only from these proxies.
trusted_proxies = ["127.0.0.1/32", "::1/128"]

[tls]
# The certificate for DoT, DoQ and DoH:
#   "acme"  obtained and renewed from Let's Encrypt
#   "files" managed by another program (certbot, for one); reloaded on change
#   "off"   no encrypted DNS
certificate = "acme"
domains = ["dns.example.com"]   # must point to this server
# Also certify the public addresses in server.listen, so Windows 11, iOS and
# macOS upgrade to encrypted DNS by themselves (DDR). These certificates last
# about 6 days and renew automatically.
ip_addresses = true
email = ""                      # optional contact for Let's Encrypt
# Domain validation, chosen automatically: "tls-alpn-01" when DoH or DoT
# listens on 443, otherwise "http-01" on port 80 (http_challenge_listen).
# challenge = "tls-alpn-01"
# http_challenge_listen = ":80"
# acme_directory = "https://acme-v02.api.letsencrypt.org/directory"
# For "files":
# cert_file = "/etc/letsencrypt/live/dns.example.com/fullchain.pem"
# key_file = "/etc/letsencrypt/live/dns.example.com/privkey.pem"

[ddr]
# Answer _dns.resolver.arpa (RFC 9462) so clients discover DoT, DoH and DoQ.
# Uses the first name in tls.domains.
enabled = true

[upstream]
# Where queries are forwarded:
#   1.1.1.1                          plain DNS (UDP, TCP when truncated)
#   tcp://1.1.1.1                    plain DNS over TCP
#   tls://one.one.one.one            DNS over TLS
#   https://cloudflare-dns.com/dns-query    DNS over HTTPS
#   h3://cloudflare-dns.com/dns-query       DNS over HTTPS, HTTP/3
#   quic://dns.example                DNS over QUIC (port 853)
# Pin a host name to an address to skip the bootstrap lookup:
#   https://dns.google/dns-query#8.8.8.8
primary = ["https://1.1.1.1/dns-query", "https://1.0.0.1/dns-query"]

# Used only when every primary fails or none answers within fallback_delay.
fallback = ["https://dns.google/dns-query#8.8.8.8"]

# Resolve upstream host names through these addresses.
bootstrap = ["1.1.1.1:53", "8.8.8.8:53"]

# Ask the fastest N primaries at once; the first good answer wins. 0: all.
parallel = 2
timeout = "3s"
fallback_delay = "1.5s"

[recursion]
# Resolve names from the root servers instead of forwarding, so no third
# party sees the queries. DNSSEC validated (root keys KSK-2017 and KSK-2024
# built in).
enabled = false
dnssec = true
# Send each server only the part of the name it needs (RFC 9156): the root
# sees "com", not "www.example.com".
qname_minimisation = true
# Also use IPv6 (skipped automatically while it fails).
ipv6 = true
# Ask the upstreams when a domain's name servers cannot be reached; never
# after a failed DNSSEC check. Where the network intercepts port 53, set the
# upstreams to your own DNSNova elsewhere (docs/restricted-networks.md).
fallback = true
# A public server never queries private networks. List networks with your own
# name servers, e.g. ["10.0.0.0/8"]; 127.0.0.0/8 and link-local addresses
# open only when listed.
# allow_networks = []
# Negative trust anchors (RFC 7646): domains with broken DNSSEC, answered
# without validation (the DNSSEC page lists failures and adds them here).
# Remove each once it validates: until then, forgeries for it pass too.
# negative_trust_anchors = ["broken.example"]
# DNS Cookies with name servers (RFC 7873): a UDP answer with the wrong
# cookie, or none from a server that always sends one, is dropped as forged.
# Servers that reject the option are asked without it.
cookies = true

[cache]
size = 100000           # entries, 1 to 2 KB each; 0: no answer cache
                        # (recursion keeps its own)
min_ttl = 0             # raise short TTLs to at least this
max_ttl = "24h"
max_negative_ttl = "1h" # NXDOMAIN and "no records"
serve_stale = "24h"     # serve expired entries while refreshing them
prefetch = true         # refresh popular entries before they expire
persist = "auto"        # keep the cache across restarts (data_dir/cache.bin,
                        # saved every 10 minutes and on shutdown). "auto": on in
                        # public mode, off in private mode. The file lists names
                        # looked up, never by whom; with few users, as at home,
                        # that is close to their browsing. Deleted when off

[access]
# Private mode only.
allow = ["198.51.100.0/24", "2001:db8:1000::/48"]
# Never answered, in either mode (wins over allow).
deny = []

[local]
# Names answered locally: "name address". "*.name" covers every name below
# it. Listed names answer only the given A and AAAA; 0.0.0.0 blocks one.
records = [
  # "nas.home 192.168.1.5",
  # "*.lab.home 192.168.1.9",
]

[ecs]
# EDNS Client Subnet: send this network (an address stands for its /24 or
# /56) with every query, so name servers answer as they would for it.
# Clients' addresses are never sent. Upstreams must support it. Changing it
# clears the cache. Empty: off.
address = ""
# For measurement tools such as DomainNova: a secret DoH path that sends each
# query's own client subnet to name servers. Its answers bypass the cache.
# Needs recursion. Keep it secret: anyone with it can query on behalf of any
# network.
# client_path = "/ecs-<24 or more random letters and digits>"

[stats]
# Overview history: "24h", "7d" or "30d". In memory only.
retention = "7d"

[limits]
# Per address, not per person: mobile carriers put many people behind one
# IPv4 address. UDP abuse is also limited by rrl_rate.
client_qps = 100            # per IPv4 address or IPv6 /56
client_burst = 400
prefix_qps = 1000           # per IPv4 /24 or IPv6 /48
prefix_burst = 4000
global_qps = 50000          # whole server; 0 = no limit
upstream_concurrency = 2000 # upstream queries in flight
zone_concurrency = 50       # upstream queries in flight per domain
# Roughly one connection per active phone. Idle, each takes about 25 KB (TCP,
# DoT) or 70 KB (DoQ): at most about 250 and 210 MB with the defaults.
tcp_connections = 10000     # TCP, DoT and DoH
quic_connections = 3000     # DoQ and HTTP/3; above half of it, new clients
                            # must first prove their address (QUIC Retry)
client_connections = 100    # open connections per address (IPv4, or IPv6 /56),
                            # all protocols together; 0 = no limit
tcp_pipeline = 16           # concurrent queries per TCP, DoT, DoQ or HTTP/3 connection
tcp_idle_timeout = "10s"    # also the idle timeout of QUIC connections
udp_max_size = 1232
rrl_rate = 20               # identical UDP responses per second per network
rrl_slip = 2                # send every 2nd limited response truncated
block_any = true            # answer ANY queries with NOTIMP

[metrics]
# Prometheus metrics at /metrics and a health check at /healthz.
listen = "127.0.0.1:9153"

[admin]
# The web interface and its API (docs/api.md). On 127.0.0.1, reach it with
# ssh -L 7000:127.0.0.1:7000 you@server. On ":7000", other machines get it
# over HTTPS once a certificate exists, behind a password, login lockout and
# optional two-step verification. Plain HTTP is served only to this server,
# a local reverse proxy sending X-Forwarded-Proto: https, and, in private
# mode, the networks in access.allow. Empty: off.
listen = "127.0.0.1:7000"

[status]
# A public page at https://your-domain/: addresses, setup steps per device
# (with a profile for iPhone and Mac), what the server keeps, and a check
# that shows visitors whether they use it. No statistics. In private mode,
# allowed networks only.
enabled = false

[filter]
# A second, filtered service: ads, trackers and malware get NXDOMAIN
# (Extended DNS Error 15: blocked). The usual addresses stay unfiltered;
# clients choose by address:
#   plain DNS  the addresses in listen below
#   DoT, DoQ   the names in names (add them to DNS and to the certificate;
#              with certificate = "acme" they are added for you)
#   DoH        the path doh_path, or a name in names
# Set all = true to filter every address instead.
enabled = false
# lists = ["https://raw.githubusercontent.com/harryheros/shieldnova/main/dist/shieldnova-full.txt"]
# block = ["example-ads.com"]       # your own rules: the name and everything under it
# allow = ["needed.example.com"]    # always answered, whatever the lists say
# update_interval = "24h"
# doh_path = "/filtered"
# names = ["filtered.dns.example.com"]
# listen = ["203.0.113.10:5353"]

# There is no setting to log queries: none are written to disk. For
# troubleshooting, the query log in the web interface runs in memory, masks
# client addresses by default, and stops by itself.

[cluster]
# Several servers sharing one configuration (docs/cluster.md). No role: a
# standalone server. Set only in this file; applies after a restart.
# role = "primary"            # or "follower"
# name = "ams-1"              # default: the host name
# region = "Amsterdam"
# listen = "10.0.0.1:7001"    # primary: where followers reach it
# primary = "10.0.0.1:7001"   # follower: the primary
# interval = "10s"            # follower: how often it syncs

[anycast]
# Announce or withdraw the anycast route as health changes, with your own
# commands, run without a shell (docs/cluster.md). Only in this file.
enabled = false
# announce = ["birdc", "enable", "anycast"]
# withdraw = ["birdc", "disable", "anycast"]
# interval = "2s"
# rise = 3                    # good checks in a row before announcing
# fall = 3                    # failed checks in a row before withdrawing
# drain = "5s"                # at shutdown: withdraw, then keep answering this long

[alerts]
# Notifications on problems and recoveries, to Telegram, Discord, Slack or a
# webhook (docs/alerts.md). Destinations are set in Settings > Alerts and kept
# in data_dir/secrets/alerts.json. A threshold of 0 turns its check off.
enabled = false
# repeat = "4h"                  # remind while a problem lasts (0s: once)
# nodes = true                   # cluster primary: also notify about the followers
# upstream_down_for = "30s"      # every upstream failing, or with recursion no
#                                # name server answering or DNS intercepted (critical)
# upstream_failing_for = "5m"    # one upstream failing half its queries
# servfail_ratio = 0.05          # SERVFAIL share over five minutes, DNSSEC aside
# servfail_min_queries = 500
# servfail_for = "5m"
# latency_p95 = "500ms"          # queries not in the cache, over five minutes
# latency_min_queries = 100
# latency_for = "5m"
# dnssec_failures = 100          # answers refused for DNSSEC in five minutes
# cert_warn_days = 14
# cert_critical_days = 3
