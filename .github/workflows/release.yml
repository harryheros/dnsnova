name: release

# Publishing a release on GitHub (for example tag v0.1.0) builds the binaries
# and attaches them, with SHA256SUMS, to that release. install.sh downloads
# from the latest published release.
on:
  release:
    types: [published]

permissions:
  contents: write
  # signed build provenance (Sigstore), checked with gh attestation verify
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true # newest 1.27.x patch, not a cached one
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          # arm: 32-bit, GOARM=6 runs on every Raspberry Pi (Zero and 1 too)
          for arch in amd64 arm64 arm; do
            dir="dnsnova-${TAG}-linux-${arch}"
            mkdir -p "build/$dir"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=6 go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" -o "build/$dir/dnsnova" ./cmd/dnsnova
            cp deploy/dnsnova.service deploy/nginx-doh.conf dnsnova.example.toml LICENSE THIRD_PARTY_NOTICES.md README.md "build/$dir/"
            tar -C build -czf "dist/dnsnova-linux-${arch}.tar.gz" --owner=0 --group=0 --mtime='2000-01-01' "$dir"
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum dnsnova-linux-*.tar.gz install.sh > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: attest
        # proves each file was built by this workflow from this tag's
        # commit: a file swapped later, with its checksum, fails the check
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/dnsnova-linux-*.tar.gz
            dist/install.sh
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
