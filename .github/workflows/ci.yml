name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: fuzz (short)
        run: |
          go test ./internal/dnsmsg -run '^$' -fuzz '^FuzzParseQuery$' -fuzztime 60s
          go test ./internal/config -run '^$' -fuzz '^FuzzParse$' -fuzztime 60s
          go test ./internal/resolver -run '^$' -fuzz '^FuzzAnalyze$' -fuzztime 60s
      - name: build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/dnsnova-linux-$arch ./cmd/dnsnova
          done
