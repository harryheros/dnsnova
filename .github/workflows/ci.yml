name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true # newest 1.27.x patch, not a cached one
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: fuzz (short)
        # every target briefly on each change; fuzz.yml runs them longer
        # every night and keeps the corpus
        run: |
          set -e
          for t in dnsmsg:FuzzParseQuery dnsmsg:FuzzOptions config:FuzzParse config:FuzzLists config:FuzzMerge \
                   resolver:FuzzAnalyze resolver:FuzzLoadCache filter:FuzzParse recursor:FuzzParseMessage \
                   proxyproto:FuzzParseV2 proxyproto:FuzzReadV1 cookie:FuzzCookie upstream:FuzzParseSpec; do
            go test ./internal/${t%%:*} -run '^$' -fuzz "^${t##*:}\$" -fuzztime 30s
          done
      - name: build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/dnsnova-linux-$arch ./cmd/dnsnova
          done
