# DNS over HTTPS through nginx, which handles TLS, HTTP/2 and HTTP/3.
# dnsnova needs:  [doh] listen = "127.0.0.1:8053"
#
# If nginx already serves this name with HTTP/3, keep your existing listen
# lines: "reuseport" may appear only once per address and port.

upstream dnsnova_doh {
    server 127.0.0.1:8053;
    keepalive 64;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;

    server_name dns.example.com;

    ssl_certificate     /etc/ssl/dns.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/dns.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data off;   # no 0-RTT: DNS queries could be replayed

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    location = /dns-query {
        proxy_pass http://dnsnova_doh;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # limits and ACLs use this
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
